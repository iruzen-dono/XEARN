# -----------------------------------------------------------------
# Lightweight PR Check
# -----------------------------------------------------------------
# This workflow runs lint and tests on pull requests only.
# It is NOT the primary CI/CD pipeline. See ci-cd.yml for the full
# pipeline that handles push-to-main builds, deployments, and smoke
# tests. The push trigger was removed here to prevent double-runs
# when commits land on main (ci-cd.yml already covers that).
# -----------------------------------------------------------------

name: CI - PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    # Pin the LTS image: `ubuntu-latest` moved to 26.04, which Playwright 1.59
    # refuses ("Playwright does not support chromium on ubuntu26.04-x64"), so
    # every run died at "Install Playwright browsers" before the E2E suite
    # started. Move back to ubuntu-latest once Playwright supports 26.04.
    runs-on: ubuntu-24.04
    # Sans timeout un job bloque (service container qui ne rend pas la main)
    # squatte la file et empeche les runs suivants de demarrer.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xearn
          POSTGRES_PASSWORD: xearn_test
          POSTGRES_DB: xearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xearn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://xearn:xearn_test@localhost:5432/xearn_test
      JWT_SECRET: ci-test-secret-key-minimum-length
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-len
      API_PORT: 4000
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Set up test database schema
        # The repo has no baseline migration: the first migration ALTERs the
        # "tasks" table, which only exists in a database built from schema.prisma.
        # `migrate deploy` therefore fails on a fresh CI database (P3018,
        # relation "tasks" does not exist). Push the schema instead — the CI
        # database is disposable and never needs migration history.
        run: npx prisma db push --skip-generate --accept-data-loss
        working-directory: apps/api

      - name: Lint
        run: npm run lint

      - name: Test API
        run: npx jest --forceExit --ci
        working-directory: apps/api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: npx playwright test --project=chromium --reporter=line
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
